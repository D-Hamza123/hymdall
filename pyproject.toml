[project]
name = "hymdall"
version = "0.6.0"
description = "A tool for detecting and analyzing malicious activity in network traffic."
authors = [
    { name = "Abdur-Rahman Dalhatu Hamza", email = "abdurrahmanhamza123@gmail.com"}
]
requires-python = ">=3.8"

[project.scripts]
hymdall = "hymdall:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["hymdall"]