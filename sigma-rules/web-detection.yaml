title: Web Detection
id: 37AABD81-3891-401D-A851-595BA54D7AF2
status: experimental
description: Detects web-based attacks and anomalies in web server logs
author: Abdur-Rahman Dalhatu Hamza
logsource:
    product: linux
    service: webserver
detection:
    selection:
      message|contains:
        - '/wp-login.php'
        - '/admin'
        - '/.env'
        - '/phpmyadmin'
    condition: selection
level: medium
tags:
  - attack.t1595.003